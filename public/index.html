<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBK / Sudirman Event Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>GBK / Sudirman Event Dashboard</h1>
      <p class="subtitle">Tracking running events across Indonesia</p>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>Legend</h2>
        <ul class="legend">
          <li><span class="dot" style="background:#eb6834"></span> Running event</li>
          <li><span class="dot" style="background:#1baf7a"></span> News roundup (low confidence)</li>
          <li><span class="dot" style="background:#4a3aa7"></span> Other</li>
        </ul>
      </section>

      <section class="panel" id="detailPanel" hidden>
        <h2 id="detailName"></h2>
        <div id="detailMeta"></div>
        <table id="detailCategories"></table>
        <img id="detailRouteImage" alt="Route map" hidden />
        <a id="detailSourceLink" target="_blank" rel="noopener">Source</a>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
    </main>

    <aside class="event-list">
      <h2>All events (<span id="eventCount">0</span>)</h2>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search name or venue..." />
        <div id="sourceFilters" class="filter-group"></div>
        <label class="checkbox-row"><input type="checkbox" id="hideLowConfidence" /> Hide low-confidence entries</label>
      </div>
      <div id="eventList"></div>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
